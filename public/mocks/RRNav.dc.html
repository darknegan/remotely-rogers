<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav style="display:flex;align-items:center;justify-content:space-between;height:78px;padding:0 48px;background:rgba(245,240,230,.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(176,138,74,.55);font-family:Archivo,sans-serif">
  <a href="F-01 Home.dc.html" style="display:flex;flex-direction:column;gap:3px;text-decoration:none">
    <span style="font-family:'Young Serif',serif;font-size:22px;line-height:1;color:#3E2C22;white-space:nowrap">Remotely Rogers</span>
    <span style="font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:#B08A4A">Rogers · Arkansas</span>
  </a>
  <div style="display:flex;align-items:center;gap:26px">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="7">
      <sc-if value="{{ l.on }}">
        <a href="{{ l.href }}" style="position:relative;padding:6px 0;font-size:13.5px;white-space:nowrap;font-weight:500;color:#6C2029;border-bottom:1.5px solid #6C2029">{{ l.label }}</a>
      </sc-if>
      <sc-if value="{{ l.off }}" hint-placeholder-val="{{ true }}">
        <a href="{{ l.href }}" style="padding:6px 0;font-size:13.5px;white-space:nowrap;color:#4A382C;border-bottom:1.5px solid transparent;transition:all .16s ease" style-hover="color:#6C2029;border-bottom-color:rgba(108,32,41,.35)" style-active="color:#561920">{{ l.label }}</a>
      </sc-if>
    </sc-for>
    <a href="F-02 Cabins.dc.html" style="margin-left:6px;padding:13px 22px;background:#6C2029;color:#F7F2E7;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;transition:all .18s ease" style-hover="background:#882A34;box-shadow:0 8px 22px rgba(108,32,41,.3)" style-active="background:#561920;box-shadow:none;transform:translateY(1px)">Check availability</a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:78},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;Cabins&quot;,&quot;Activities&quot;,&quot;Recommendations&quot;,&quot;Work Stays&quot;,&quot;Multi-Cabin&quot;,&quot;Contact&quot;,&quot;None&quot;],&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'Home';
    const L = [['Home','F-01 Home.dc.html'],['Cabins','F-02 Cabins.dc.html'],['Activities','F-04 Activities.dc.html'],['Recommendations','F-05 Recommendations.dc.html'],['Work Stays','F-06 Work Stays.dc.html'],['Multi-Cabin','F-07 Multi-Cabin.dc.html'],['Contact','F-10 Contact.dc.html']];
    return { links: L.map(([label, href]) => ({ label, href, on: label === a, off: label !== a })) };
  }
}
</script>
</body>
</html>
