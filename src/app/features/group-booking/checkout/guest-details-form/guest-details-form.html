<form class="rr-guest-form" [formGroup]="form" (ngSubmit)="submit()">
  <h3>Guest details</h3>
  <p class="rr-guest-form__lead">
    You’ll pay for every selected cabin in one Stripe checkout. After payment we create one Lodgify
    reservation per cabin.
  </p>

  <label class="rr-guest-form__field">
    <span>First name *</span>
    <input
      id="guest-first-name"
      pInputText
      formControlName="firstName"
      autocomplete="given-name"
      placeholder="First name"
    />
    @if (invalid('firstName')) {
      <small class="rr-guest-form__error">First name is required.</small>
    }
  </label>

  <label class="rr-guest-form__field">
    <span>Last name *</span>
    <input
      id="guest-last-name"
      pInputText
      formControlName="lastName"
      autocomplete="family-name"
      placeholder="Last name"
    />
    @if (invalid('lastName')) {
      <small class="rr-guest-form__error">Last name is required.</small>
    }
  </label>

  <label class="rr-guest-form__field rr-guest-form__field--full">
    <span>Email *</span>
    <input
      id="guest-email"
      pInputText
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="you@example.com"
    />
    @if (invalid('email')) {
      <small class="rr-guest-form__error">Enter a valid email.</small>
    }
  </label>

  <label class="rr-guest-form__field">
    <span>Phone <em>(optional)</em></span>
    <input
      id="guest-phone"
      pInputText
      type="tel"
      formControlName="phone"
      autocomplete="tel"
      placeholder="Phone"
    />
  </label>

  <label class="rr-guest-form__field rr-guest-form__field--full">
    <span>Notes <em>(optional)</em></span>
    <textarea
      id="guest-notes"
      pTextarea
      formControlName="notes"
      rows="3"
      placeholder="Arrival time, special requests…"
    ></textarea>
  </label>

  @if (state.checkoutError(); as checkoutError) {
    <p-message severity="error" [text]="checkoutError" styleClass="rr-guest-form__message" />
  }

  <div class="rr-guest-form__actions">
    <p-button
      type="button"
      label="Back"
      styleClass="rr-cabins-btn rr-cabins-btn--outline"
      [disabled]="state.checkoutLoading()"
      (onClick)="backToCalendar()"
    />
    <p-button
      type="submit"
      label="Pay now"
      styleClass="rr-cabins-btn rr-cabins-btn--primary"
      [loading]="state.checkoutLoading()"
      [disabled]="state.cartItems().length === 0"
    />
  </div>
</form>
