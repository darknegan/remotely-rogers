<div
  class="rr-group-booking"
  [class.rr-group-booking--embed]="embedMode()"
  [class.rr-group-booking--embedded]="embedded()"
>
  @if (!embedded()) {
    <header class="rr-group-booking__header">
      <h2>Group booking calendar</h2>
      <p>
        Pick dates on each cabin row to build your group stay — every cabin can have a different
        check-in, check-out, and number of nights.
      </p>
    </header>
  }

  <div class="rr-group-booking__widget">
    <app-date-range-form />

    <div class="rr-group-booking__layout">
      <app-cabin-grid />
      <app-cart-summary class="rr-group-booking__desktop-cart" />
    </div>
  </div>

  <div class="rr-group-booking__mobile-cart rr-group-booking-mobile-only">
    <button
      type="button"
      class="rr-group-booking__mobile-cart-bar"
      (click)="openMobileCart()"
      aria-label="Open booking cart"
    >
      <span class="rr-group-booking__mobile-cart-handle" aria-hidden="true"></span>
      <div class="rr-group-booking__mobile-cart-summary">
        <div class="rr-group-booking__mobile-cart-top">
          <span class="rr-group-booking__mobile-cart-count">{{ mobileCartSummary() }}</span>
          @if (state.cartItems().length > 0) {
            <span class="rr-group-booking__mobile-cart-total">
              {{ state.selectedTotal() | currency: 'USD' : 'symbol' : '1.0-0' }}
            </span>
          }
        </div>
        @if (mobileCartDetails()) {
          <p class="rr-group-booking__mobile-cart-details">{{ mobileCartDetails() }}</p>
        }
      </div>
    </button>
  </div>

  <p-drawer
    [visible]="mobileCartOpen()"
    (visibleChange)="mobileCartOpen.set($event)"
    position="bottom"
    styleClass="rr-group-booking-cart-drawer"
    [modal]="true"
    [dismissible]="true"
    [showCloseIcon]="false"
    [blockScroll]="true"
  >
    <div class="rr-group-booking-cart-drawer__panel">
      <div class="rr-group-booking-cart-drawer__handle" aria-hidden="true"></div>
      <app-cart-summary (checkoutRequested)="closeMobileCart()" />
    </div>
  </p-drawer>
</div>
