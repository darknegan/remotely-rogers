<div class="rr-group-booking" [class.rr-group-booking--embed]="embedMode()">
  <header class="rr-group-booking__header">
    <p class="rr-kicker">Group booking</p>
    <h2>Book multiple cabins together</h2>
    <p>
      Pick dates on each cabin row to build your group stay — every cabin can have a different
      check-in, check-out, and number of nights.
    </p>
  </header>

  <app-date-range-form />

  <div class="rr-group-booking__layout">
    <app-cabin-grid />
    <app-cart-summary class="rr-cart-desktop" />
  </div>
  <div class="rr-pane-toggle" style="margin-top: 16px">
    <p-button type="button" label="Your group cart" (onClick)="cartOpen.set(true)" />
  </div>
  <p-drawer header="Your group cart" [visible]="cartOpen()" (visibleChange)="cartOpen.set($event)" position="bottom" [style]="{ height: '70vh' }">
    <app-cart-summary />
  </p-drawer>
</div>
