<div class="rr-guest-steppers">
  <header>
    <span class="rr-kicker">Guests</span>
    <span>{{ guestCount() }} of {{ maxGuests() }} guests</span>
  </header>

  <div class="rr-guest-row">
    <div>
      <strong>{{ state.guestStepperLabel() }}</strong>
      <p>Sleeps up to {{ maxGuests() }}, including children.</p>
    </div>
    <div class="rr-stepper">
      <button type="button" (click)="change(-1)" [disabled]="disabled()">−</button>
      <span>{{ guestCount() }}</span>
      <button type="button" (click)="change(1)" [disabled]="disabled()">+</button>
    </div>
  </div>
</div>
