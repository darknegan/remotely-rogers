<div class="rr-booking-bar" [class.rr-booking-bar--home]="layout() === 'home'">
  <button type="button" class="rr-booking-bar__field" (click)="checkInPopover.toggle($event)">
    <div class="rr-booking-bar__label">Check-in</div>
    <div class="rr-booking-bar__value">{{ checkInLabel() }}</div>
  </button>

  <button type="button" class="rr-booking-bar__field" (click)="checkOutPopover.toggle($event)">
    <div class="rr-booking-bar__label">Check-out</div>
    <div class="rr-booking-bar__value">{{ checkOutLabel() }}</div>
  </button>

  <button type="button" class="rr-booking-bar__field" (click)="guestPopover.toggle($event)">
    <div class="rr-booking-bar__label">Guests</div>
    <div class="rr-booking-bar__value">
      {{ search.guestSummary() }}<span class="rr-booking-bar__guest-cap"> · up to 4 per cabin</span>
    </div>
  </button>

  <button
    type="button"
    class="rr-booking-bar__search"
    [disabled]="!search.canSearch()"
    (click)="searchCabins()"
  >
    Search
  </button>
</div>

<p-popover #checkInPopover styleClass="rr-date-popover-panel">
  <p-date-picker
    [ngModel]="search.checkIn()"
    (ngModelChange)="onCheckInChange($event)"
    name="checkIn"
    [minDate]="minDate"
    dateFormat="D, M d"
    [inline]="true"
    [showIcon]="false"
  />
</p-popover>

<p-popover #checkOutPopover styleClass="rr-date-popover-panel">
  <p-date-picker
    [ngModel]="search.checkOut()"
    (ngModelChange)="onCheckOutChange($event)"
    name="checkOut"
    [minDate]="search.checkIn() ?? minDate"
    dateFormat="D, M d"
    [inline]="true"
    [showIcon]="false"
  />
</p-popover>

<p-popover #guestPopover styleClass="rr-guest-popover-panel">
  <div class="rr-guest-popover">
    <div style="padding: 1.375rem 1.5rem 0.375rem">
      @for (stepper of guestSteppers; track stepper.key) {
        <div class="rr-guest-popover__row">
          <div>
            <div class="rr-guest-popover__label">{{ stepper.label }}</div>
            <div class="rr-guest-popover__sub">{{ stepper.sub }}</div>
          </div>
          <div class="rr-guest-popover__stepper">
            <p-input-number
              [ngModel]="search.guests()[stepper.key]"
              (ngModelChange)="updateGuest(stepper.key, $event)"
              [name]="stepper.key"
              [min]="limits(stepper.key).min"
              [max]="limits(stepper.key).max"
              [showButtons]="true"
              buttonLayout="horizontal"
              incrementButtonIcon="pi pi-plus"
              decrementButtonIcon="pi pi-minus"
            />
          </div>
        </div>
      }
      <p class="rr-guest-popover__note">
        {{ search.capNote() }}
        <a routerLink="/preview/multi-cabin-stays">Book several cabins</a>
      </p>
    </div>
    <div class="rr-guest-popover__actions" style="padding: 0 1.5rem 1.25rem">
      <button type="button" class="rr-btn rr-btn--text" (click)="search.resetGuests()">Reset</button>
      <button type="button" class="rr-btn rr-btn--primary" (click)="guestPopover.hide()">Apply</button>
    </div>
  </div>
</p-popover>
